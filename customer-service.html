<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لينكار — بوابة خدمة العملاء</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05090c">
<link rel="icon" href="img/linkar_mark.png">
<script src="auth.js"></script>
<script>if (!LinkarAuth.current()) location.replace('login.html?next=' + encodeURIComponent(location.pathname.split('/').pop() || 'customer-service.html'));</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Kufi"; src: url("fonts/NotoKufiArabic-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Kufi"; src: url("fonts/NotoKufiArabic-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Kufi"; src: url("fonts/NotoKufiArabic-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  :root {
    --bg: #05090c; --bg-2: #0a141b; --card: #0c171f; --card-2: #0f1d27; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
    --text: #eef3f5; --muted: #8d9ca6; --green: #a4ff00; --green-ink: #0a0a0a;
    --s-new: #58b7ff; --s-contacted: #f5c451; --s-interested: #c792ff; --s-scheduled: #a4ff00; --s-completed: #3cc81e; --s-lost: #ff6b6b;
    --font: "Kufi", system-ui, sans-serif;
  }
  :root[lang="en"] { --font: "Manrope", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(5,9,12,.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(164,255,0,.18); }
  header .in { display: flex; align-items: center; gap: 16px; padding: 12px 24px; }
  header img { height: 24px; }
  header h1 { font-size: 16px; font-weight: 600; color: var(--muted); padding-inline-start: 16px; border-inline-start: 1px solid var(--line-2); }
  header .sp { flex: 1; }
  .lang { display: flex; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
  .lang button { border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 99px; cursor: pointer; }
  .lang button[data-lang="ar"] { font-family: "Kufi", sans-serif; } .lang button[data-lang="en"] { font-family: "Manrope", sans-serif; }
  .lang button.on { background: var(--text); color: var(--bg); }
  .agent { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .agent input { width: 140px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

  main { padding: 20px 24px 60px; max-width: 1500px; margin-inline: auto; }
  .note-bar { display: flex; gap: 10px; align-items: flex-start; background: rgba(245,196,81,.08); border: 1px solid rgba(245,196,81,.3); color: #f3dca0; border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: border-color .2s; }
  .kpi:hover, .kpi.on { border-color: var(--green); }
  .kpi span { color: var(--muted); font-size: 12px; }
  .kpi b { display: block; font-size: 28px; font-weight: 700; font-family: "Manrope", sans-serif; line-height: 1.2; margin-top: 2px; }
  .kpi.due b { color: #f5c451; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .toolbar input[type="search"], .toolbar select { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 150px; }
  .toolbar input[type="search"] { flex: 1; min-width: 220px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; padding: 9px 14px; cursor: pointer; white-space: nowrap; font-weight: 600; }
  .btn:hover { border-color: var(--green); }
  .btn.primary { background: var(--green); color: var(--green-ink); border-color: var(--green); }
  .btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 920px; }
  th { text-align: start; font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--card-2); position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr { cursor: pointer; transition: background .15s; }
  tbody tr:hover { background: rgba(164,255,0,.04); }
  tbody tr.sel { background: rgba(164,255,0,.08); }
  .who b { display: block; font-weight: 600; }
  .who small { color: var(--muted); direction: ltr; unicode-bidi: isolate; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .type { font-size: 12px; color: var(--muted); }
  .type.provider { color: #c792ff; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
  .due-today { color: #f5c451; font-weight: 600; }
  .overdue { color: var(--s-lost); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

  /* drawer */
  .drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(560px, 100%); background: var(--bg-2); border-inline-start: 1px solid var(--line-2); z-index: 40; transform: translateX(calc(100% * var(--dir, -1))); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: 0 0 60px rgba(0,0,0,.6); }
  :root[dir="ltr"] .drawer { --dir: 1; }
  .drawer.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .dh { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .dh h2 { font-size: 20px; font-weight: 700; }
  .dh .sp { flex: 1; }
  .dh .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
  .quick { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .db { flex: 1; overflow: auto; padding: 18px 20px 30px; }
  .grp { margin-bottom: 20px; }
  .grp h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); width: 100%; }
  label.f input:focus, label.f select:focus, textarea:focus { outline: none; border-color: var(--green); }
  label.f input[type="tel"], label.f input[type="email"] { direction: ltr; text-align: start; }
  .status-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .status-row button { border: 1px solid var(--line-2); background: var(--card); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .status-row button.on { color: var(--green-ink); }
  .svc-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .svc-pick label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  .svc-pick input { accent-color: var(--green); }
  .svc-pick label:has(input:checked) { border-color: var(--green); background: rgba(164,255,0,.08); }
  textarea { min-height: 70px; resize: vertical; }
  .timeline { display: grid; gap: 10px; margin-top: 12px; }
  .tl { border-inline-start: 2px solid var(--line-2); padding-inline-start: 12px; }
  .tl.note { border-color: var(--green); }
  .tl small { color: var(--muted); font-size: 11px; }
  .tl p { white-space: pre-wrap; }
  .saved { color: var(--green); font-size: 12px; opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }
  .modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(0,0,0,.6); padding: 16px; }
  .modal.open { display: grid; }
  .modal .box { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 16px; padding: 22px; width: min(460px, 100%); display: grid; gap: 10px; }
  .modal h2 { font-size: 18px; }

  .me { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .me b { color: var(--text); font-weight: 600; }
  .me .role { font-size: 11px; border: 1px solid var(--line-2); border-radius: 99px; padding: 0 8px; }
  .combo { position: relative; }
  .combo input { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; padding-inline-end: 30px; color: var(--text); }
  .combo input:focus { outline: none; border-color: var(--green); }
  .combo input:disabled { opacity: .5; cursor: not-allowed; }
  .combo::after { content: ""; position: absolute; top: 50%; inset-inline-end: 12px; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .combo ul { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 240px; overflow: auto; list-style: none; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 4px; box-shadow: 0 16px 40px rgba(0,0,0,.5); display: none; }
  .combo.open ul { display: block; }
  .combo li { padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; color: var(--text); font-size: 13px; }
  .combo li small { color: var(--muted); }
  .combo li.act, .combo li:hover { background: rgba(164,255,0,.12); }
  .combo li.none { color: var(--muted); cursor: default; background: none; }
  .staff-list { display: grid; gap: 8px; max-height: 260px; overflow: auto; }
  .staff-list > div { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .staff-list > div > span { flex: 1; }
  .staff-list small { color: var(--muted); display: block; }
  .err { color: #ff7b7b; font-size: 12px; min-height: 16px; }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) {
    header .in { padding: 10px 14px; flex-wrap: wrap; }
    header h1 { display: none; }
    .agent input { width: 110px; }
    main { padding: 14px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="in">
    <img id="logo" src="img/linkar_logo_ar_white.png" alt="LINKAR">
    <h1 data-t="title"></h1>
    <span class="sp"></span>
    <span class="me"><span data-t="agent"></span><b id="meName"></b><span class="role" id="meRole"></span></span>
    <button class="btn sm" id="staffBtn" data-t="staff" hidden></button>
    <button class="btn sm" id="logoutBtn" data-t="logout"></button>
    <div class="lang"><button type="button" data-lang="en">English</button><button type="button" data-lang="ar">العربية</button></div>
  </div>
</header>

<main>
  <div class="kpis" id="kpis"></div>
  <div class="toolbar">
    <input type="search" id="q">
    <select id="fStatus"></select>
    <select id="fType"></select>
    <select id="fService"></select>
    <button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="add"></span></button>
    <button class="btn" id="csvBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>CSV</button>
    <button class="btn" id="jsonBtn" data-t="backup"></button>
    <label class="btn"><span data-t="restore"></span><input type="file" id="importFile" accept="application/json" hidden></label>
    <button class="btn" id="demoBtn" data-t="demo"></button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th data-sort="name" data-t="c.name"></th>
        <th data-sort="type" data-t="c.type"></th>
        <th data-t="c.services"></th>
        <th data-sort="preferredDate" data-t="c.pref"></th>
        <th data-sort="status" data-t="c.status"></th>
        <th data-sort="followUp" data-t="c.follow"></th>
        <th data-sort="agent" data-t="c.agent"></th>
        <th data-sort="createdAt" data-t="c.created"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh">
    <div><h2 id="dName"></h2><div class="muted" id="dMeta"></div></div>
    <span class="sp"></span><span class="saved" id="saved"></span>
    <button class="x" id="closeBtn" aria-label="Close">×</button>
  </div>
  <div class="quick" id="quick"></div>
  <div class="db">
    <div class="grp"><h3 data-t="g.status"></h3><div class="status-row" id="statusRow"></div></div>
    <div class="grp"><h3 data-t="g.contact"></h3>
      <div class="grid2">
        <label class="f"><span data-t="f.name"></span><input data-k="name"></label>
        <label class="f"><span data-t="f.type"></span><select data-k="type"></select></label>
        <label class="f"><span data-t="f.phone"></span><input data-k="phone" type="tel"></label>
        <label class="f"><span data-t="f.email"></span><input data-k="email" type="email"></label>
        <label class="f"><span data-t="f.company"></span><input data-k="company"></label>
        <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted)"><span data-t="f.city"></span><div class="combo" id="cCity"></div></div>
      </div>
    </div>
    <div class="grp"><h3 data-t="g.need"></h3>
      <div class="svc-pick" id="svcPick"></div>
      <div class="grid2" style="margin-top:10px">
        <label class="f"><span data-t="f.date"></span><input data-k="preferredDate" type="date"></label>
        <label class="f"><span data-t="f.time"></span><select data-k="preferredTime"></select></label>
        <label class="f"><span data-t="f.priority"></span><select data-k="priority"></select></label>
        <span></span>
        <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted)"><span data-t="f.make"></span><div class="combo" id="cMake"></div></div>
        <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted)"><span data-t="f.model"></span><div class="combo" id="cModel"></div></div>
      </div>
    </div>
    <div class="grp"><h3 data-t="g.follow"></h3>
      <div class="grid2">
        <label class="f"><span data-t="f.agent"></span><input data-k="agent"></label>
        <label class="f"><span data-t="f.followUp"></span><input data-k="followUp" type="datetime-local"></label>
      </div>
    </div>
    <div class="grp"><h3 data-t="g.notes"></h3>
      <textarea id="noteText"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap" id="noteQuick"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>
</aside>

<div class="modal" id="addModal">
  <form class="box" id="addForm">
    <h2 data-t="add"></h2>
    <label class="f"><span data-t="f.type"></span><select name="type"></select></label>
    <label class="f"><span data-t="f.name"></span><input name="name" required></label>
    <label class="f"><span data-t="f.phone"></span><input name="phone" type="tel" required></label>
    <label class="f"><span data-t="f.email"></span><input name="email" type="email"></label>
    <label class="f"><span data-t="f.company"></span><input name="company"></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button type="button" class="btn" id="addCancel" data-t="cancel"></button>
      <button class="btn primary" data-t="save"></button>
    </div>
  </form>
</div>

<div class="modal" id="staffModal">
  <div class="box" style="width:min(520px,100%)">
    <h2 data-t="staff"></h2>
    <div class="staff-list" id="staffList"></div>
    <form id="staffForm" style="display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px">
      <h3 style="font-size:14px" data-t="newStaff"></h3>
      <div class="grid2">
        <label class="f"><span data-t="f.name"></span><input name="name" required></label>
        <label class="f"><span data-t="user"></span><input name="username" required autocapitalize="off" style="direction:ltr"></label>
        <label class="f"><span data-t="pass"></span><input name="password" type="password" required autocomplete="new-password" style="direction:ltr"></label>
        <label class="f"><span data-t="role"></span><select name="role"></select></label>
      </div>
      <div class="err" id="staffErr"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn" id="staffClose" data-t="close"></button>
        <button class="btn primary" data-t="addStaff"></button>
      </div>
    </form>
  </div>
</div>

<script src="portal-data.js"></script>
<script src="linkar-store.js"></script>
<script>
(() => {
  const Store = window.LinkarStore;
  const T = {

      search: 'ابحث بالاسم أو الجوال أو البريد…', allStatus: 'كل الحالات', allTypes: 'كل الأنواع', allServices: 'كل الخدمات',

      c: { name: 'العميل', type: 'النوع', services: 'الخدمات المطلوبة', pref: 'الموعد المفضل', status: 'الحالة', follow: 'المتابعة القادمة', agent: 'المسؤول', created: 'تاريخ التسجيل' },

  const cCity = combo($('#cCity'), { options: cityOpts, onPick: v => { const r = cur(); if (r) { r.city = v; persist(r); } } });
  const cModel = combo($('#cModel'), { options: modelOpts, onPick: v => { const r = cur(); if (r) { r.carModel = v; persist(r); } } });
  const cMake = combo($('#cMake'), { options: makeOpts, onPick: v => {
    const r = cur(); if (!r) return;
    if (r.carMake !== v) r.carModel = '';
    r.carMake = v; persist(r); fillCombos(r);
    setTimeout(() => $('#cModel input').focus(), 0);
  } });
  function fillCombos(r) {
    cCity.set(cityValue(r.city));
    cMake.set(r.carMake);
    cModel.set(r.carModel, !r.carMake, r.carMake ? t().pick : t().pickMakeFirst);
  }

  /* ---------- staff accounts (admins) ---------- */
  $('#meName').textContent = me.name;
  $('#logoutBtn').addEventListener('click', () => { LinkarAuth.logout(); location.replace('login.html'); });
  $('#staffBtn').hidden = me.role !== 'admin';
  function drawStaff() {
    $('#staffList').innerHTML = LinkarAuth.users().map(u => `<div>
      <span><b>${esc(u.name)}</b> ${u.username === me.username ? t().you : ''}<small>${esc(u.username)} · ${t().roles[u.role]}${u.lastLogin ? ' · ' + fmtDT(u.lastLogin) : ''}</small></span>
      <button type="button" class="btn sm" data-reset="${esc(u.username)}">${t().resetPw}</button>
      ${u.username === me.username ? '' : `<button type="button" class="btn sm" data-del="${esc(u.username)}">${t().remove}</button>`}
    </div>`).join('');
  }
  $('#staffBtn').addEventListener('click', () => { $('#staffErr').textContent = ''; drawStaff(); $('#staffModal').classList.add('open'); });
  $('#staffClose').addEventListener('click', () => $('#staffModal').classList.remove('open'));
  $('#staffList').addEventListener('click', async e => {
    const del = e.target.closest('[data-del]'), rs = e.target.closest('[data-reset]');
    try {
      if (del && confirm(`${t().remove}: ${del.dataset.del}?`)) { LinkarAuth.removeUser(del.dataset.del); drawStaff(); }
      if (rs) { const pw = prompt(`${t().newPw} ${rs.dataset.reset}`); if (pw) { await LinkarAuth.resetPassword(rs.dataset.reset, pw); $('#staffErr').textContent = ''; } }
    } catch (x) { $('#staffErr').textContent = t().errs[x.message] || x.message; }
  });
  $('#staffForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try { await LinkarAuth.createUser(f); e.target.reset(); $('#staffErr').textContent = ''; drawStaff(); }
    catch (x) { $('#staffErr').textContent = t().errs[x.message] || x.message; }
  });

  /* ---------- language ---------- */
  function setLang(l) {
    lang = l === 'en' ? 'en' : 'ar';
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = (lang === 'ar' ? 'لينكار — ' : 'LINKAR — ') + t().title;
    $('#logo').src = lang === 'ar' ? 'img/linkar_logo_ar_white.png' : 'img/linkar_logo_white.png';
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = el.dataset.t.split('.').reduce((o, k) => o?.[k], t()) ?? ''; });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    $('#q').placeholder = t().search; $('#noteText').placeholder = t().notePh;
    const opts = (sel, all, map) => { const v = $(sel).value; $(sel).innerHTML = `<option value="">${all}</option>` + Object.entries(map).map(([k, n]) => `<option value="${k}">${n}</option>`).join(''); $(sel).value = v; };
    opts('#fStatus', t().allStatus, t().st); opts('#fType', t().allTypes, t().type);
    opts('#fService', t().allServices, Object.fromEntries(Store.SERVICES.map(s => [s.id, s[lang]])));
    const fill = (el, map) => { const v = el.value; el.innerHTML = Object.entries(map).map(([k, n]) => `<option value="${k}">${n}</option>`).join(''); el.value = v; };
    fill(document.querySelector('#drawer [data-k="type"]'), t().type); fill($('#addForm').elements.type, t().type);
    fill(document.querySelector('#drawer [data-k="preferredTime"]'), t().time); fill($('#staffForm').elements.role, t().roles);
    $('#meRole').textContent = t().roles[me.role] || ''; fill(document.querySelector('#drawer [data-k="priority"]'), t().pr);
    $('#noteQuick').innerHTML = `<button type="button" class="btn sm primary" data-add="1">${t().addNote}</button>` + t().qn.map(q => `<button type="button" class="btn sm">${q}</button>`).join('');
    try { localStorage.setItem('linkar-lang', lang); } catch (e) {}
    render(); if (selId) fillDrawer();
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  // new sign-ups from the landing page (another tab) show up live
  addEventListener('storage', e => { if (e.key === 'linkar-registrations-v1') load(); });
  addEventListener('focus', load);

  let saved = new URLSearchParams(location.search).get('lang');
  if (!saved) { try { saved = localStorage.getItem('linkar-lang'); } catch (e) {} }
  setLang(saved || 'ar');
  load();
})();
</script>
</body>
</html>
